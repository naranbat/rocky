# A project whose jobs each live in their own file under jobs/.
# The files share this project's env file; paths inside them are relative to each file.
#   rocky exec examples/imports.yaml health
#   rocky exec examples/imports.yaml report
#   rocky run examples/imports.yaml
env_file: httpbin.env             # BASE and USER, shared by every imported job

schedules:
  health:
    every: 5m

jobs:
  health: jobs/health.yaml
  report: jobs/report.yaml
  files: jobs/files.yaml          # also used by httpbin.yaml
