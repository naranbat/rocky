# Variables from `vars` and an env file (path relative to this file).
# Run: rocky exec examples/vars-env.yaml user
env_file: example.env
vars:
  BASE: https://httpbin.org
  USER_ID: "42"
jobs:
  user:
    steps:
      user:
        get:
          url: ${BASE}/anything/users/${USER_ID}
          headers:
            Authorization: Bearer ${API_TOKEN}
