# Conditions: `when` runs a task only if it holds. If count > 10 call /big, else check the message.
#   rocky exec conditional
schedule:
  hourly: 15                      # at minute 15 of every hour
tasks:
  stats:                          # --data-urlencode encodes the query value
    cmd: [curl, -sS, --fail-with-body, -G, '${BASE}/anything/stats', -d, 'count=${COUNT}', --data-urlencode, 'message=warning: disk low']

  # httpbin echoes query values as strings ("15"); numeric strings compare as numbers.
  big:
    when: { this: tasks.stats.stdout.args.count, gt: 10 }
    cmd: [curl, -sS, --fail-with-body, -X, POST, '${BASE}/anything/big']

  warn:
    when:                         # a list: every condition must hold
      - { this: tasks.stats.stdout.args.count, lte: 10 }
      - { this: tasks.stats.stdout.args.message, contains: warning }
      - not: { this: tasks.stats.stdout.args.message, matches: "^ignore" }
    cmd: [curl, -sS, --fail-with-body, -X, POST, '${BASE}/anything/warn']
