# A report built from a login and two commands.
#   rocky exec report
tasks:
  login:
    cmd: [curl, -sS, --fail-with-body, --json, '@-', '${BASE}/anything/login']   # --json sends stdin as the body
    stdin:
      token: demo-token                # httpbin echoes it back as stdout.json.token

  today:
    cmd: [date, +%Y-%m-%d]

  shout:
    cmd: [tr, a-z, A-Z]
    stdin: ${USER}                     # the command's standard input

  report:
    cmd: [curl, -sS, --fail-with-body, -H, 'Authorization: Bearer ${tasks.login.stdout.json.token}', --json, '@-', '${BASE}/anything/report']
    timeout: 10s                       # or 5m, 2h
    stdin:
      user: ${tasks.shout.stdout}
      date: ${tasks.today.stdout}
