# Polling: run the request again until the status is 200, at most 10 times.
#   rocky exec poll
tasks:
  check:                          # httpbin picks 200 or 503 at random
    cmd: [curl, -sS, -o, /dev/null, -w, '%{http_code}', '${BASE}/status/200,503']
    retry:
      attempts: 10                # fails the task if still not 200 after 10 runs
      delay: 1s                   # wait between runs
      until: { this: tasks.check.stdout, eq: 200 }   # checked after each run; a failed run (e.g. curl can't connect) is tried again
