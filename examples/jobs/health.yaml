# A job in its own file, used by imports.yaml.
#   rocky exec examples/imports.yaml health
schedule:
  every: 5m                          # `rocky run examples/imports.yaml` runs it every 5 minutes

tasks:
  status:
    cmd: [curl, -sS, --fail-with-body, '${BASE}/status/200']   # --fail-with-body: a 4xx/5xx exits non-zero
    timeout: 5

  check:
    cmd: [curl, -sS, --fail-with-body, -G, '${BASE}/get', -d, 'exit_code=${tasks.status.exit_code}']   # -G -d: a query
