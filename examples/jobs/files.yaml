# A job in its own file, used by httpbin.yaml and imports.yaml. Paths are relative to this file.
#   rocky exec examples/httpbin.yaml files
tasks:
  login: ../tasks/login.yaml       # a task from its own file

  whoami:
    get:
      url: ${BASE}/headers
      headers:
        Authorization: Bearer ${tasks.login.body.json.token}
    timeout: 10                      # seconds (default 30s for HTTP)
