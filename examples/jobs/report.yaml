# A job in its own file, used by imports.yaml. Paths are relative to this file.
#   rocky exec examples/imports.yaml report
steps:
  login: ../steps/login.yaml         # a step from its own file

  today:
    cmd: [date, +%Y-%m-%d]

  shout:
    cmd: [tr, a-z, A-Z]
    stdin: ${USER}                     # the command's standard input

  report:
    post:
      url: ${BASE}/anything/report
      headers:
        Authorization: Bearer ${steps.login.body.json.token}
      json:
        user: ${steps.shout.stdout}
        date: ${steps.today.stdout}
