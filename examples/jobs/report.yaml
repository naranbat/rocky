# A job in its own file, used by imports.yaml. Paths are relative to this file.
#   rocky exec examples/imports.yaml report
tasks:
  login: ../tasks/login.yaml         # a task from its own file

  today:
    cmd: [date, +%Y-%m-%d]

  shout:
    cmd: [tr, a-z, A-Z]
    stdin: ${USER}                     # the command's standard input

  report:
    post:
      url: ${BASE}/anything/report
      headers:
        Authorization: Bearer ${tasks.login.body.json.token}
      json:
        user: ${tasks.shout.stdout}
        date: ${tasks.today.stdout}
