# A project: jobs that share an env file. Every job sends requests to https://httpbin.org with curl;
# its JSON output is parsed, so later tasks read fields with ${tasks.NAME.stdout.FIELD}.
#   rocky exec examples/httpbin.yaml login       # run one job
#   rocky run examples/httpbin.yaml              # run the jobs that have a `schedule`
env_file: httpbin.env                 # BASE, USER and COUNT

jobs:
  # List, "log in", then use their results.
  login:
    # When `rocky run` runs this job. `rocky exec` checks this but doesn't run it.
    schedule:
      every: 5m                       # every 30s, 5m, 2h...
      delay: 10s                      # optional: wait before the first run
    tasks:
      list:                           # -G -d: a query; --fail-with-body: a 4xx/5xx exits non-zero
        cmd: [curl, -sS, --fail-with-body, -G, '${BASE}/get', -d, page=2, -H, 'Accept: application/json']

      login:
        cmd: [curl, -sS, --fail-with-body, --json, '@-', '${BASE}/anything/login']   # --json sends stdin as the body
        stdin:                        # written as JSON
          token: demo-token           # httpbin echoes the JSON body under `json`

      whoami:
        cmd:
          - curl
          - -sS
          - --fail-with-body
          - -H
          - 'Authorization: Bearer ${tasks.login.stdout.json.token}'
          - -H
          - 'X-Page: ${tasks.list.stdout.args.page}'
          - ${BASE}/headers

  # Requests and other commands together, including writing and reading a file. Any task can read an earlier task's
  # result with ${tasks.NAME.path}.
  mixed:
    schedule:
      daily: "09:30"                  # local time, every day
    tasks:
      today:
        cmd: [date, +%Y-%m-%d]        # program + arguments, run without a shell

      version:
        cmd: [sh, -c, 'echo "rocky version 1.4.2 (build 77)" | cut -d " " -f 3']     # -> "1.4.2"

      shout:
        cmd: [tr, a-z, A-Z]
        stdin: ${USER}                # the command's standard input

      save:                           # the path is $1, never inside the script
        cmd: [sh, -c, 'cat > "$1"', _, report.json]
        cwd: .                        # relative to this file, not your current directory
        stdin:                        # written as JSON
          user: ${tasks.shout.stdout}
          date: ${tasks.today.stdout}
          version: ${tasks.version.stdout}

      load:
        cmd: [cat, report.json]       # JSON stdout is parsed
        cwd: .

      report:
        cmd: [curl, -sS, --fail-with-body, --json, '@-', '${BASE}/anything/report']
        stdin: ${tasks.load.stdout}

  # Branching: if count > 10 call /big, else check the message.
  conditional:
    schedule:
      hourly: 15                      # at minute 15 of every hour
    tasks:
      stats:                          # --data-urlencode encodes the query value
        cmd: [curl, -sS, --fail-with-body, -G, '${BASE}/anything/stats', -d, 'count=${COUNT}', --data-urlencode, 'message=warning: disk low']

      # httpbin echoes query values as strings ("15"); numeric strings compare as numbers.
      route:
        if: { this: tasks.stats.stdout.args.count, gt: 10 }
        then:
          big:
            cmd: [curl, -sS, --fail-with-body, -X, POST, '${BASE}/anything/big']
        else:
          check:
            if:
              all:
                - { this: tasks.stats.stdout.args.message, contains: warning }
                - not: { this: tasks.stats.stdout.args.message, matches: "^ignore" }
            then:
              warn:
                cmd: [curl, -sS, --fail-with-body, -X, POST, '${BASE}/anything/warn']

  # Tolerating a timeout: `allow_failure` keeps going and the result is just `{error: ...}`; `exists` checks for it.
  health:
    tasks:
      ping:
        cmd: [curl, -sS, --fail-with-body, '${BASE}/delay/3']   # httpbin waits 3s before answering
        timeout: 1                    # set to 5 to take the `else` branch
        allow_failure: true

      report:
        if: { this: tasks.ping.error, exists: true }   # never fails on an undefined variable
        then:
          failed:
            cmd: [echo, 'ping failed: ${tasks.ping.error}']
        else:
          ok:
            cmd: [echo, 'ping reached ${tasks.ping.stdout.url}']

  # Looping: fetch a list, then POST once per element.
  loop:
    tasks:
      users:
        cmd: [curl, -sS, --fail-with-body, --json, '@-', '${BASE}/anything/users']
        stdin:
          users:
            - { id: 1, name: alice }
            - { id: 2, name: bob }

      notify_all:
        for_each: tasks.users.stdout.json.users   # must be a list
        as: USER                      # optional; defaults to ITEM
        do:
          notify:
            cmd: [curl, -sS, --fail-with-body, --json, '@-', '${BASE}/anything/notify/${USER.id}']
            stdin:
              name: ${USER.name}

  # Polling: retry while the status isn't 200, at most 10 times.
  poll:
    tasks:
      check:                          # httpbin picks 200 or 503 at random
        cmd: [curl, -sS, -o, /dev/null, -w, '%{http_code}', '${BASE}/status/200,503']

      retry:
        while: { this: tasks.check.stdout, ne: 200 }   # checked before each iteration
        max: 10                       # optional; fails the task if still true after 10
        do:
          pause:
            cmd: [sleep, '1']
          check:                      # updates tasks.check for the next check
            cmd: [curl, -sS, -o, /dev/null, -w, '%{http_code}', '${BASE}/status/200,503']

  # A job file that uses a task file, with `timeout`.
  files: jobs/files.yaml
